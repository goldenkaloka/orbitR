x-env: &env
  DEBUG: ${DEBUG}
  DB_HOST: db
  DB_PORT: '5432'
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
  CENTRIFUGO_API_URL: http://centrifugo:8000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
  CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET}
  CENTRIFUGO_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET}

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb local/${MINIO_STORAGE_BUCKET_NAME} || true;
      /usr/bin/mc anonymous set public local/${MINIO_STORAGE_BUCKET_NAME};
      exit 0;
      "

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo:/centrifugo:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_VAR_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: "redis://:${REDIS_PASSWORD}@redis:6379/2"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: .
    image: orbitr-app:latest
    volumes:
      - .:/app
    env_file:
      - .env
    environment: *env
    command: gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 4 --timeout 120 --keep-alive 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config worker -l info -Q default,dispatch --concurrency ${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-payments:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config worker -l info -Q payments --concurrency ${CELERY_PAYMENTS_CONCURRENCY:-1}
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/www:/var/www
      - ./nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_started
      centrifugo:
        condition: service_started
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./nginx/www:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  minio_data:
