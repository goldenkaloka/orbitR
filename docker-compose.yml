x-env: &env
  DEBUG: ${DEBUG}
  DB_HOST: db
  DB_PORT: '5432'
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  MINIO_ENDPOINT: http://rustfs:9001
  MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
  CENTRIFUGO_API_URL: http://centrifugo:8000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
  CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET}
  CENTRIFUGO_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET}

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage.
  #
  # MinIO's images were pulled from the public registries after the 2021 AGPL
  # relicensing, so `minio/minio` no longer resolves at all. RustFS is a Rust
  # S3-compatible server that still speaks the same API, so the app and the
  # boto3 provisioning step are unchanged. It even reads the MINIO_ROOT_USER /
  # MINIO_ROOT_PASSWORD names natively.
  #
  # Container 9001 is the S3 API and 9000 is the web console. Both are
  # published so product images can be fetched by the browser during local
  # development — see MINIO_EXTERNAL_URL in .env.
  rustfs:
    image: rustfs/rustfs:latest
    # Non-root image against a root-owned named volume.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - rustfs_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bucket + public-read policy. `minio/mc` is also gone from the public
  # registries, so this uses boto3 from the app image instead — one less
  # external image to depend on.
  storage-init:
    image: orbitr-app:latest
    pull_policy: never
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    command: python manage.py init_media_bucket
    env_file:
      - .env
    environment:
      <<: *env
      MINIO_ENDPOINT: http://rustfs:9001
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo:/centrifugo:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_VAR_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: "redis://:${REDIS_PASSWORD}@redis:6379/2"
    ports:
      # Expose the realtime gateway to the host so devices on the LAN can open
      # the websocket directly (host 8000 is taken by the Django/gunicorn
      # container). In production nginx fronts this, so the mapping is
      # dev-only convenience.
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: .
    image: orbitr-app:latest
    volumes:
      - .:/app
    env_file:
      - .env
    environment: *env
    command: gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 4 --timeout 120 --keep-alive 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config worker -l info -Q default,dispatch --concurrency ${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-payments:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config worker -l info -Q payments --concurrency ${CELERY_PAYMENTS_CONCURRENCY:-1}
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: orbitr-app:latest
    pull_policy: never
    volumes:
      - .:/app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/www:/var/www
      - ./nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_started
      centrifugo:
        condition: service_started
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./nginx/www:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  rustfs_data:
