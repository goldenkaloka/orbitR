# Storefront (Next.js) — mwanachuoshop.com
#
# The site is read-only catalogue: every request is served by the Next server
# container, which talks to Django over the compose network. No write path and
# no auth cookies ever cross this boundary, so the body limit stays tiny.

limit_req_zone $binary_remote_addr zone=storefront_limit:10m rate=30r/s;

server {
    listen 80;
    server_name mwanachuoshop.com www.mwanachuoshop.com;

    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mwanachuoshop.com www.mwanachuoshop.com;

    # One SAN cert covers both the apex and www.
    ssl_certificate /etc/letsencrypt/live/mwanachuoshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwanachuoshop.com/privkey.pem;

    # TLS Hardening
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/mwanachuoshop.com/fullchain.pem;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Catalogue browsing only — there are no uploads on this site.
    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    # Upstream held in a variable so nginx does not resolve it at start-up —
    # the storefront can boot after nginx without taking the whole stack down.
    set $storefront_upstream http://web:3000;

    # Next fingerprints every asset it emits, so they are safe to cache hard.
    location /_next/static/ {
        limit_req zone=storefront_limit burst=20 nodelay;
        proxy_pass $storefront_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap and robots are regenerated on a timer, not per request.
    location = /sitemap.xml {
        proxy_pass $storefront_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
    }

    # SSR pages. Buffering stays on so a slow origin cannot pin the socket.
    location / {
        limit_req zone=storefront_limit burst=40 nodelay;
        proxy_pass $storefront_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
