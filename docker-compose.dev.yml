services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  centrifugo:
    ports:
      - "8001:8000"

  backend:
    ports:
      - "8000:8001"
    volumes:
      - .:/app
      - logs_data:/app/logs
    environment:
      - DEBUG=True
      - MINIO_EXTERNAL_URL=http://localhost:9000

  celery-worker:
    volumes:
      - .:/app
      - logs_data:/app/logs

  celery-worker-payments:
    volumes:
      - .:/app
      - logs_data:/app/logs

  celery-beat:
    volumes:
      - .:/app
      - logs_data:/app/logs

volumes:
  logs_data:
