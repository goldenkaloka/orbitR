<div style="
  background: var(--color-base-900, #1e293b);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  border-left: 4px solid {{ color }};
">
  <span class="material-symbols-outlined" style="font-size:2rem; color:{{ color }};">{{ icon }}</span>
  <div>
    <div style="font-size:.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.25rem;">{{ title }}</div>
    <div style="font-size:1.6rem; font-weight:700; color:#f1f5f9; line-height:1;">{{ value }}</div>
  </div>
</div>
