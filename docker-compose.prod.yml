services:
  # Internal services have no public ports in production.
  # They are reached through the Nginx gateway or internal bridge.
  db:
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=api.mwanachuoshop.com
      - CSRF_TRUSTED_ORIGINS=https://api.mwanachuoshop.com
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - MINIO_EXTERNAL_URL=https://api.mwanachuoshop.com
      - MINIO_STORAGE_BUCKET_NAME=media

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  certbot-etc:
  certbot-var:
  certbot-webroot:
